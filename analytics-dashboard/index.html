<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Analytics Dashboard</title>

    <link rel="stylesheet"
          href="style.css">
</head>
<body>

<div class="dashboard">

    <header>
        <h1>Analytics Dashboard</h1>
    </header>

    <!-- KPI CARDS -->

    <section class="kpi-grid">

        <div class="kpi-card">
            <h3>Total Revenue</h3>
            <p>$125,000</p>
        </div>

        <div class="kpi-card">
            <h3>Total Users</h3>
            <p>8,450</p>
        </div>

        <div class="kpi-card">
            <h3>Orders</h3>
            <p>1,245</p>
        </div>

        <div class="kpi-card">
            <h3>Growth</h3>
            <p>18%</p>
        </div>

    </section>

    <!-- CHART SECTION -->

    <section class="chart-section">

        <h2>Sales Overview</h2>

        <div class="chart-placeholder">
            Chart Area
        </div>

    </section>

    <!-- TABLE SECTION -->

    <section class="table-section">

        <h2>Recent Transactions</h2>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Customer</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>1001</td>
                        <td>John</td>
                        <td>$250</td>
                        <td>Completed</td>
                    </tr>

                    <tr>
                        <td>1002</td>
                        <td>Emma</td>
                        <td>$180</td>
                        <td>Pending</td>
                    </tr>

                    <tr>
                        <td>1003</td>
                        <td>David</td>
                        <td>$320</td>
                        <td>Completed</td>
                    </tr>

                    <tr>
                        <td>1004</td>
                        <td>Sophia</td>
                        <td>$450</td>
                        <td>Completed</td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
