<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Amazon Clone</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->

<header class="navbar">

    <div class="logo">
        amazon
    </div>

    <div class="search-container">

        <input
            type="text"
            placeholder="Search Amazon">

        <button>Search</button>

    </div>

    <div class="nav-links">

        <div>Account</div>

        <div>Orders</div>

        <div>Cart 🛒</div>

    </div>

</header>

<!-- SECONDARY NAV -->

<nav class="sub-nav">

    <a href="#">Today's Deals</a>

    <a href="#">Electronics</a>

    <a href="#">Fashion</a>

    <a href="#">Mobiles</a>

    <a href="#">Books</a>

</nav>

<!-- HERO -->

<section class="hero">

    <h1>Welcome to Amazon</h1>

    <p>Discover millions of products.</p>

</section>

<!-- PRODUCTS -->

<section class="products">

    <div class="product-card">

        <img
        src="https://picsum.photos/300/200?1">

        <h3>Product 1</h3>

        <p>$99</p>

        <button>Add to Cart</button>

    </div>

    <div class="product-card">

        <img
        src="https://picsum.photos/300/200?2">

        <h3>Product 2</h3>

        <p>$149</p>

        <button>Add to Cart</button>

    </div>

    <div class="product-card">

        <img
        src="https://picsum.photos/300/200?3">

        <h3>Product 3</h3>

        <p>$199</p>

        <button>Add to Cart</button>

    </div>

    <div class="product-card">

        <img
        src="https://picsum.photos/300/200?4">

        <h3>Product 4</h3>

        <p>$249</p>

        <button>Add to Cart</button>

    </div>

</section>

<!-- FOOTER -->

<footer>

    <p>
        © 2026 Amazon Clone
    </p>

</footer>

</body>
</html>
