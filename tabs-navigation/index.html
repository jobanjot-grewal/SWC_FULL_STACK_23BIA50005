<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Navigation</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Dashboard Navigation</h1>

    <div class="tabs">

        <button class="tab-btn active"
                data-tab="overview">
            Overview
        </button>

        <button class="tab-btn"
                data-tab="details">
            Details
        </button>

        <button class="tab-btn"
                data-tab="settings">
            Settings
        </button>

    </div>

    <div class="tab-content">

        <div class="content active-content"
             id="overview">

            <h2>Overview</h2>

            <p>
                This is the overview section.
                Dashboard summary appears here.
            </p>

        </div>

        <div class="content"
             id="details">

            <h2>Details</h2>

            <p>
                Detailed information is shown here.
            </p>

        </div>

        <div class="content"
             id="settings">

            <h2>Settings</h2>

            <p>
                User settings and preferences.
            </p>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
