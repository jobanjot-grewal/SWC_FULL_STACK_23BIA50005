<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Image Upload Preview</title>

<link rel="stylesheet"
      href="style.css">
</head>

<body>

<div class="container">

    <h1>Profile Photo Upload</h1>

    <input
        type="file"
        id="imageInput"
        accept="image/*">

    <p id="errorMessage"></p>

    <div class="preview-container">

        <img
            id="previewImage"
            alt="Preview">

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
