<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="carousel-container" id="carousel">

        <div class="carousel-slide" id="carouselSlide">

            <img src="https://picsum.photos/id/1015/800/400" alt="Image 1">

            <img src="https://picsum.photos/id/1016/800/400" alt="Image 2">

            <img src="https://picsum.photos/id/1018/800/400" alt="Image 3">

            <img src="https://picsum.photos/id/1020/800/400" alt="Image 4">

        </div>

        <!-- Buttons -->
        <button class="prev-btn" id="prevBtn">
            ❮
        </button>

        <button class="next-btn" id="nextBtn">
            ❯
        </button>

        <!-- Dots -->
        <div class="dots-container" id="dotsContainer"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
